name: tidy

services:
  app:
    build: .
    ports:
      - "${TIDY_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/tidy.db
      TIDY_E2E: ${TIDY_E2E:-}  # set to 1 only for Playwright runs; see frontend/AGENTS.md
    volumes:
      - tidy-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  tidy-data:
