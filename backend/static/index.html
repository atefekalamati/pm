<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tidy</title>
</head>
<body style="font-family: sans-serif; background: #f6f1e7; color: #1f2a37; padding: 2rem">
  <h1 style="color: #1e3a5f">Hello World</h1>
  <p>API status: <strong id="status">checking...</strong></p>
  <script>
    fetch("/api/health")
      .then((response) => response.json())
      .then((data) => (document.getElementById("status").textContent = data.status))
      .catch(() => (document.getElementById("status").textContent = "unreachable"));
  </script>
</body>
</html>
