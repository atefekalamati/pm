[project]
name = "tidy-backend"
version = "0.1.0"
description = "FastAPI backend for Tidy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "openai>=3.51.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
